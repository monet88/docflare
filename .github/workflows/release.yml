name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_RELEASE_LTO: thin

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, bundles: "app,dmg", platform: darwin-aarch64, updaterGlob: "\\.app\\.tar\\.gz", updaterAsset: "Docflare_aarch64.app.tar.gz" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg", platform: darwin-x86_64, updaterGlob: "\\.app\\.tar\\.gz", updaterAsset: "Docflare_x64.app.tar.gz" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage", platform: linux-x86_64, updaterGlob: "\\.AppImage", updaterAsset: "Docflare_{v}_amd64.AppImage" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: "nsis", platform: windows-x86_64, updaterGlob: "-setup\\.exe", updaterAsset: "Docflare_{v}_x64-setup.exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Download pinned sidecar
        run: npm run download-sidecar -- --target ${{ matrix.target }}

      - name: Verify sidecar checksum
        run: npm run verify-sidecar -- --target ${{ matrix.target }}

      - name: Build and bundle (tauri-action)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Docflare ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Each job builds a single-platform latest.json. Do NOT let tauri-action
          # upload it (4 parallel jobs would overwrite each other on the release).
          # The aggregate-updater job merges all 4 and uploads one manifest.
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build Windows portable ZIP
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $stage = "staging/Docflare-$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/Docflare.exe" $stage/
          Copy-Item "src-tauri/binaries/cloudflared-x86_64-pc-windows-msvc.exe" "$stage/cloudflared.exe"
          Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage/
          $zip = "Docflare_v.${version}_x64_portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          # Only upload to a release on tag pushes (a draft release exists then).
          # On workflow_dispatch (branch ref) the ZIP is built as a smoke test but not uploaded.
          if ("${{ github.ref_type }}" -eq "tag") {
            gh release upload "${{ github.ref_name }}" $zip --clobber
          } else {
            Write-Host "workflow_dispatch: built $zip (skipping release upload, no tag)"
          }

      - name: Stage per-target updater fragment
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          PLATFORM_KEY: ${{ matrix.platform }}
          UPDATER_GLOB: ${{ matrix.updaterGlob }}
          UPDATER_ASSET: ${{ matrix.updaterAsset }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p updater-out
          version=$(node -p "require('./package.json').version")

          # Find the signed updater artifact's .sig (the artifact tauri's updater
          # downloads). Prefer artifactPaths output, fall back to a tree scan.
          sig=$(printf '%s' "$ARTIFACT_PATHS" | jq -r '.[]?' 2>/dev/null | grep -E "${UPDATER_GLOB}\\.sig$" | head -n1 || true)
          if [ -z "$sig" ] || [ ! -f "$sig" ]; then
            sig=$(find src-tauri/target -type f -name '*.sig' | grep -E "${UPDATER_GLOB}\\.sig$" | head -n1 || true)
          fi
          if [ -z "$sig" ] || [ ! -f "$sig" ]; then
            echo "::error::updater .sig not found for ${PLATFORM_KEY} (glob ${UPDATER_GLOB}). createUpdaterArtifacts disabled or signing failed."
            echo "--- artifactPaths ---"; printf '%s\n' "$ARTIFACT_PATHS"
            echo "--- .sig files ---"; find src-tauri/target -name '*.sig' || true
            exit 1
          fi

          # The release asset name differs from the on-disk bundle name (tauri-action
          # renames macOS app bundles to include the arch, e.g. Docflare_aarch64.app.tar.gz).
          # Use the explicit per-platform asset name with the version substituted.
          asset="${UPDATER_ASSET/\{v\}/$version}"
          url="https://github.com/${REPO}/releases/download/${TAG}/${asset}"
          echo "platform=${PLATFORM_KEY} sig=${sig} asset=${asset}"

          node scripts/build-updater-fragment.mjs \
            --platform "${PLATFORM_KEY}" \
            --version "${version}" \
            --sig "${sig}" \
            --url "${url}" \
            --out "updater-out/latest-${PLATFORM_KEY}.json"

      - name: Upload per-target updater fragment artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}
          path: updater-out/latest-${{ matrix.platform }}.json
          if-no-files-found: error

  aggregate-updater:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download per-target updater fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-fragments
          merge-multiple: true

      - name: Merge per-target latest.json into one manifest
        run: node scripts/merge-updater-manifest.mjs updater-fragments latest.json

      - name: Upload merged latest.json to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber
