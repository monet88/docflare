name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Lint GitHub Actions workflows (actionlint)
        if: matrix.os == 'ubuntu-22.04'
        uses: raven-actions/actionlint@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (frontend)
        run: npm run lint

      - name: Test (frontend)
        run: npm test

      - name: Test (build/release scripts)
        run: npm run test:scripts

      - name: Download pinned sidecar
        run: npm run download-sidecar -- --target ${{ matrix.target }}

      - name: Verify sidecar checksum
        run: npm run verify-sidecar -- --target ${{ matrix.target }}

      - name: Test (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy (Rust)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Compile check (tauri build --no-bundle)
        run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}
